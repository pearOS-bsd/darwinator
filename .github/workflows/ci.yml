name: build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  freebsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86-64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Build the module and run the Mach-O tests on FreeBSD ${{ matrix.arch }}
        uses: cross-platform-actions/action@v1.7.0
        with:
          operating_system: freebsd
          architecture: ${{ matrix.arch }}
          version: '14.5'
          memory: 4G
          shell: sh
          run: |
            set -e
            sudo pkg install -y python3 >/dev/null 2>&1
            # kernel sources of the running release (only sys/ is needed)
            REL="$(freebsd-version -u | sed 's/-p[0-9]*$//')"
            case "$(uname -p)" in amd64) RELDIR=amd64 ;; *) RELDIR=arm64/aarch64 ;; esac
            fetch -q -o /tmp/src.txz "https://download.freebsd.org/releases/$RELDIR/$REL/src.txz"
            sudo tar -xf /tmp/src.txz -C / usr/src/sys
            make SYSDIR=/usr/src/sys
            sudo sh tests/run.sh
